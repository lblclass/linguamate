name: LinguaMate
options:
  bundleIdPrefix: com.linguamate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LinguaMate:
    type: application
    platform: iOS
    sources:
      - path: LinguaMate
    info:
      path: LinguaMate/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linguamate.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
  LinguaMateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LinguaMateTests
    dependencies:
      - target: LinguaMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linguamate.app.tests
        GENERATE_INFOPLIST_FILE: YES
